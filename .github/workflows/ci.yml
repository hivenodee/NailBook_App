name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Type Check (web)
        run: pnpm --filter web exec tsc --noEmit
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Type Check (shared)
        run: pnpm --filter @nailbook/shared exec tsc --noEmit

      - name: Unit Tests
        run: pnpm --filter web test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build web app
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_APP_URL: https://example.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  migration-check:
    name: Migration Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for pending migrations
        run: |
          # Verify migration files exist and schema is in sync
          if [ ! -d "packages/db/prisma/migrations" ]; then
            echo "::error::No migrations directory found. Run 'prisma migrate dev' to create migrations."
            exit 1
          fi
          echo "Migration files present. Run 'prisma migrate deploy' against your database before deploying."
